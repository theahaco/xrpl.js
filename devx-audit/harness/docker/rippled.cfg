# Minimal stand-alone rippled configuration for local development/testing.
#
# This node never connects to any peer-to-peer network or performs consensus
# (it's started with --standalone --start). It exists purely so this
# project's scripts and integration tests have a free, disposable, fully
# local XRPL instance to run against. Do not use this configuration for
# anything connected to Mainnet, Testnet, or Devnet.
#
# Loosely based on the example stand-alone/CI configs published by
# XRPLF (rippled/xrpl.js), trimmed to what stand-alone mode actually needs.

[server]
port_rpc_admin_local
port_ws_admin_local
port_peer

# Bind to the wildcard address (not just localhost) so Docker's port mapping can reach
# these ports from the host.
[port_rpc_admin_local]
port = 5005
ip = 0.0.0.0
admin = 0.0.0.0
protocol = http

[port_ws_admin_local]
port = 6006
ip = 0.0.0.0
admin = 0.0.0.0
protocol = ws

# Present but unused: rippled expects a peer port to be configured even
# though stand-alone mode never actually opens peer connections.
[port_peer]
port = 51235
ip = 0.0.0.0
protocol = peer

[node_size]
tiny

[node_db]
type=NuDB
path=/tmp/aha-devx-ledger/db/nudb
advisory_delete=0

[ledger_history]
full

[database_path]
/tmp/aha-devx-ledger/db

[debug_logfile]
/tmp/aha-devx-debug.log

[sntp_servers]
time.apple.com
time.nist.gov
pool.ntp.org

[rpc_startup]
{ "command": "log_level", "severity": "warning" }

